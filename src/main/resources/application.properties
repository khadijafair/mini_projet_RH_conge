spring.application.name=rh-conges

# Profil par défaut : dev (H2 en mémoire + données de démo).
# En production : SPRING_PROFILES_ACTIVE=prod (MySQL).
spring.profiles.active=dev

server.port=8080

# Le schéma est géré par Flyway (src/main/resources/db/migration) ; Hibernate ne le modifie jamais.
spring.jpa.hibernate.ddl-auto=none

# API REST : jetons JWT (clé de 32 octets minimum ; JWT_SECRET obligatoire en production)
rh.jwt.secret=${JWT_SECRET:cle-de-developpement-a-remplacer-en-production-0123456789}
rh.jwt.duree-secondes=3600

# Documentation OpenAPI limitée à l'API REST
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operationsSorter=method

# Compter le samedi comme jour de congé (jours ouvrables, Code du travail) au lieu des jours ouvrés
rh.samedi-ouvrable=false

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Fêtes religieuses marocaines (calendrier hégirien), à renseigner chaque année
# au format ISO, séparées par des virgules. Ex. : 2027-03-10,2027-03-11
rh.jours-feries-mobiles=
