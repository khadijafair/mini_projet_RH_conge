<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Employés</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/demandes}">
            <i class="bi bi-calendar3-week me-2"></i>RH Congés
        </a>
        <div class="navbar-nav ms-3 flex-row gap-3">
            <a class="nav-link text-white" th:href="@{/demandes}"><i class="bi bi-file-earmark-text me-1"></i>Demandes</a>
            <a class="nav-link text-white active" th:href="@{/employes}"><i class="bi bi-people me-1"></i>Employés</a>
            <a class="nav-link text-white" th:href="@{/types-conge}"><i class="bi bi-tags me-1"></i>Types</a>
            <a class="nav-link text-white" th:href="@{/stats}"><i class="bi bi-bar-chart-line me-1"></i>Stats</a>
        </div>
    </div>
</nav>

<div class="container-fluid py-4 px-4">
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-people text-primary me-2"></i>Employés
        </h2>
        <a th:href="@{/employes/new}" class="btn btn-primary">
            <i class="bi bi-person-plus me-1"></i>Nouvel Employé
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Nom</th>
                    <th>Département</th>
                    <th>Date d'embauche</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(employes)}">
                    <td colspan="5" class="text-center py-5 text-muted">
                        <i class="bi bi-person-x fs-2 d-block mb-2"></i>Aucun employé enregistré
                    </td>
                </tr>
                <tr th:each="e : ${employes}">
                    <td class="text-muted small" th:text="${e.id}"></td>
                    <td class="fw-semibold">
                        <i class="bi bi-person-circle text-secondary me-1"></i>
                        <span th:text="${e.nom}"></span>
                    </td>
                    <td>
                        <span class="badge bg-primary bg-opacity-10 text-primary"
                              th:text="${e.departement}"></span>
                    </td>
                    <td th:text="${#temporals.format(e.dateEmbauche, 'dd/MM/yyyy')}"></td>
                    <td class="text-center">
                        <div class="btn-group btn-group-sm">
                            <a th:href="@{/employes/edit/{id}(id=${e.id})}"
                               class="btn btn-outline-secondary" title="Modifier">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/employes/delete/{id}(id=${e.id})}"
                               class="btn btn-outline-danger" title="Supprimer"
                               onclick="return confirm('Supprimer cet employé ?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small">
            <span th:text="${#lists.size(employes)} + ' employé(s)'"></span>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
