<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${demande.id == null ? 'Nouvelle demande' : 'Modifier demande'}">Demande</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/demandes}">
            <i class="bi bi-calendar3-week me-2"></i>RH Congés
        </a>
    </div>
</nav>

<div class="container py-4" style="max-width:700px">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/demandes}">Demandes</a></li>
            <li class="breadcrumb-item active"
                th:text="${demande.id == null ? 'Nouvelle demande' : 'Modifier la demande #' + demande.id}"></li>
        </ol>
    </nav>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom py-3">
            <h5 class="mb-0 fw-bold">
                <i class="bi bi-file-earmark-plus text-primary me-2"></i>
                <span th:text="${demande.id == null ? 'Soumettre une demande de congé' : 'Modifier la demande'}"></span>
            </h5>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/demandes/save}" th:object="${demande}" method="post">
                <input type="hidden" th:field="*{id}"/>
                <input type="hidden" th:field="*{statut}"/>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Employé <span class="text-danger">*</span></label>
                    <select th:field="*{employe.id}" class="form-select"
                            th:classappend="${#fields.hasErrors('employe')} ? 'is-invalid'">
                        <option value="">-- Sélectionner un employé --</option>
                        <option th:each="e : ${employes}"
                                th:value="${e.id}"
                                th:text="${e.nom + ' (' + e.departement + ')'}">
                        </option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('employe')}"
                         th:errors="*{employe}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Type de congé <span class="text-danger">*</span></label>
                    <select th:field="*{typeConge.id}" class="form-select"
                            th:classappend="${#fields.hasErrors('typeConge')} ? 'is-invalid'">
                        <option value="">-- Sélectionner un type --</option>
                        <option th:each="t : ${types}"
                                th:value="${t.id}"
                                th:text="${t.libelle + ' (quota: ' + t.quotaAnnuel + ' j)'}">
                        </option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('typeConge')}"
                         th:errors="*{typeConge}"></div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Date de début <span class="text-danger">*</span></label>
                        <input type="date" th:field="*{dateDebut}" class="form-control"
                               th:classappend="${#fields.hasErrors('dateDebut')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dateDebut')}"
                             th:errors="*{dateDebut}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Date de fin <span class="text-danger">*</span></label>
                        <input type="date" th:field="*{dateFin}" class="form-control"
                               th:classappend="${#fields.hasErrors('dateFin')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dateFin')}"
                             th:errors="*{dateFin}"></div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Motif</label>
                    <textarea th:field="*{motif}" class="form-control" rows="3"
                              placeholder="Décrivez le motif de votre demande..."></textarea>
                </div>

                <div class="d-flex gap-2 justify-content-end">
                    <a th:href="@{/demandes}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Annuler
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-send me-1"></i>
                        <span th:text="${demande.id == null ? 'Soumettre' : 'Enregistrer'}"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
