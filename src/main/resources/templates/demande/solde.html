<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head}">
    <title>Solde de congés</title>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container py-4" style="max-width:900px">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-pie-chart text-primary me-2"></i>Solde de congés
        </h2>
        <form method="get" class="d-flex gap-2 align-items-center">
            <label class="small text-muted" for="annee">Année</label>
            <input type="number" id="annee" name="annee" class="form-control form-control-sm"
                   style="width:100px" th:value="${annee}"/>
            <button type="submit" class="btn btn-sm btn-outline-primary">Afficher</button>
        </form>
    </div>

    <p class="mb-3">
        <strong th:text="${employe.nom}">Employé</strong>
        <span class="badge bg-secondary bg-opacity-10 text-secondary ms-2" th:text="${employe.departement}"></span>
        <span class="text-muted small ms-2">— en jours ouvrés (hors week-ends et jours fériés)</span>
    </p>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Type de congé</th>
                    <th class="text-end">Quota</th>
                    <th class="text-end">Pris</th>
                    <th class="text-end">En attente</th>
                    <th class="text-end">Restants</th>
                    <th style="width:30%">Utilisation</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${soldes}">
                    <td class="fw-semibold" th:text="${s.type().libelle}"></td>
                    <td class="text-end" th:text="${s.quota()}"></td>
                    <td class="text-end" th:text="${s.consommes()}"></td>
                    <td class="text-end" th:text="${s.enAttente()}"></td>
                    <td class="text-end fw-bold"
                        th:classappend="${s.restants() == 0} ? 'text-danger' : 'text-success'"
                        th:text="${s.restants()}"></td>
                    <td>
                        <div class="progress" style="height:10px">
                            <div class="progress-bar bg-success"
                                 th:style="'width:' + ${s.quota() > 0 ? s.consommes() * 100 / s.quota() : 0} + '%'"></div>
                            <div class="progress-bar bg-warning"
                                 th:style="'width:' + ${s.quota() > 0 ? s.enAttente() * 100 / s.quota() : 0} + '%'"></div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <a th:href="@{/demandes}" class="btn btn-outline-secondary btn-sm mt-3">
        <i class="bi bi-arrow-left me-1"></i>Retour aux demandes
    </a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
