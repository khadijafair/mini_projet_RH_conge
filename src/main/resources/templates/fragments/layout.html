<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title != null ? title + ' – RH Congés' : 'RH Congés'}">RH Congés</title>
    <!-- Bootstrap 5 -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:fragment="navbar">
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" th:href="@{/demandes}">
                <i class="bi bi-calendar3-week me-2"></i>RH Congés
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/demandes}">
                            <i class="bi bi-file-earmark-text me-1"></i>Demandes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/employes}">
                            <i class="bi bi-people me-1"></i>Employés
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/types-conge}">
                            <i class="bi bi-tags me-1"></i>Types de Congé
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/stats}">
                            <i class="bi bi-bar-chart-line me-1"></i>Statistiques
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>

<!-- CONTENT -->
<div class="container-fluid py-4 px-4">
    <!-- Flash messages -->
    <div th:fragment="alerts">
        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-2"></i>
            <span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle me-2"></i>
            <span th:text="${errorMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>

    <!-- Page content injection -->
    <div th:replace="${content}">
        <!-- content replaced by child templates -->
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Chart.js pour les stats -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</body>
</html>
