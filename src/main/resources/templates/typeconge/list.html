<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <title>Types de Congé</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/demandes}">
            <i class="bi bi-calendar3-week me-2"></i>RH Congés
        </a>
        <div class="navbar-nav ms-3 flex-row gap-3">
            <a class="nav-link text-white" th:href="@{/demandes}"><i class="bi bi-file-earmark-text me-1"></i>Demandes</a>
            <a class="nav-link text-white" th:href="@{/employes}"><i class="bi bi-people me-1"></i>Employés</a>
            <a class="nav-link text-white active" th:href="@{/types-conge}"><i class="bi bi-tags me-1"></i>Types</a>
            <a class="nav-link text-white" th:href="@{/stats}"><i class="bi bi-bar-chart-line me-1"></i>Stats</a>
        </div>
    </div>
</nav>

<div class="container py-4" style="max-width:900px">
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-tags text-primary me-2"></i>Types de Congé
        </h2>
        <a th:href="@{/types-conge/new}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>Nouveau Type
        </a>
    </div>

    <div class="row g-3">
        <div class="col-md-4" th:each="t : ${types}">
            <div class="card h-100 border-0 shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h5 class="card-title fw-bold mb-1" th:text="${t.libelle}"></h5>
                            <span class="badge bg-primary rounded-pill fs-6"
                                  th:text="${t.quotaAnnuel} + ' jours / an'"></span>
                        </div>
                        <i class="bi bi-calendar2-check fs-2 text-primary opacity-25"></i>
                    </div>
                </div>
                <div class="card-footer bg-transparent d-flex justify-content-end gap-2">
                    <a th:href="@{/types-conge/edit/{id}(id=${t.id})}"
                       class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-pencil me-1"></i>Modifier
                    </a>
                    <a th:href="@{/types-conge/delete/{id}(id=${t.id})}"
                       class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('Supprimer ce type de congé ?')">
                        <i class="bi bi-trash me-1"></i>Supprimer
                    </a>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(types)}" class="col-12">
            <div class="text-center py-5 text-muted">
                <i class="bi bi-tags fs-1 d-block mb-2"></i>
                Aucun type de congé défini
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
