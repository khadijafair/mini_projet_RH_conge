# Lancement : RH_ADMIN_PASSWORD=<mot de passe RH> docker compose up --build
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rh_conges
      MYSQL_USER: rh
      MYSQL_PASSWORD: ${DB_PASSWORD:-rh_conges_dev}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/mysql

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/rh_conges?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: rh
      DB_PASSWORD: ${DB_PASSWORD:-rh_conges_dev}
      RH_ADMIN_PASSWORD: ${RH_ADMIN_PASSWORD:?Définissez RH_ADMIN_PASSWORD (8 caractères minimum)}
    ports:
      - "8080:8080"

volumes:
  db-data:
